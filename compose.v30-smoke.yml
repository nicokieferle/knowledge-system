services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: knowledge_smoke
      POSTGRES_PASSWORD: ${SMOKE_POSTGRES_PASSWORD:?Set by run_v30_postgres_recovery_smoke.sh}
      POSTGRES_DB: knowledge_v30_smoke
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20

  smoke:
    image: ${SMOKE_IMAGE_NAME:?Set by run_v30_postgres_recovery_smoke.sh}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://knowledge_smoke:${SMOKE_POSTGRES_PASSWORD}@postgres:5432/knowledge_v30_smoke
      V30_SMOKE_CONFIRM: isolated-v30-smoke-database
      KNOWLEDGE_ROOT: /app/knowledge
      EMBEDDING_DIMENSIONS: "384"
    volumes:
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
    command: python /app/scripts/conversation_postgres_smoke.py

volumes:
  postgres_data:
