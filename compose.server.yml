name: knowledge-system

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.server}

    volumes:
      - /data/knowledgesystem/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  knowledge-mcp:
    image: knowledge-system-mcp:local

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.server}

      KNOWLEDGE_ROOT: /app/knowledge

      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}

      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_PATH: ${MCP_PATH:-/mcp}

      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:8000,localhost:8000}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}

      HOME: /home/knowledge
      HF_HOME: /home/knowledge/.cache/huggingface

    ports:
      - target: 8000
        published: "8000"
        host_ip: 127.0.0.1
        protocol: tcp

    volumes:
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true

      - type: bind
        source: /data/knowledgesystem/huggingface
        target: /home/knowledge/.cache/huggingface

    read_only: true

    tmpfs:
      - /tmp:size=256m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 8000), timeout=2).close()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  telegram-bot:
    image: knowledge-system-mcp:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["knowledge-telegram"]
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.server}
      KNOWLEDGE_ROOT: /app/knowledge
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in .env.server}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env.server}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env.server}
      REVIEW_BASE_URL: ${REVIEW_BASE_URL:-}
      HOME: /home/knowledge
      HF_HOME: /home/knowledge/.cache/huggingface
    volumes:
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
      - type: bind
        source: /data/knowledgesystem/huggingface
        target: /home/knowledge/.cache/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  review-web:
    image: knowledge-system-mcp:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["knowledge-review"]
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.server}
      KNOWLEDGE_ROOT: /app/knowledge
      REVIEW_MODE: production
      REVIEW_PASSWORD_HASH: ${REVIEW_PASSWORD_HASH:?Set Argon2id hash in .env.server}
      REVIEW_SESSION_SECRET: ${REVIEW_SESSION_SECRET:?Set random session secret in .env.server}
      REVIEW_OWNER_CLIENT_TYPE: ${REVIEW_OWNER_CLIENT_TYPE:?Set owner client type}
      REVIEW_OWNER_CHAT_ID: ${REVIEW_OWNER_CHAT_ID:?Set owner chat ID}
      REVIEW_OWNER_USER_ID: ${REVIEW_OWNER_USER_ID:?Set owner user ID}
      REVIEW_ALLOWED_HOSTS: ${REVIEW_ALLOWED_HOSTS:-127.0.0.1:8080,localhost:8080}
      REVIEW_SESSION_SECONDS: ${REVIEW_SESSION_SECONDS:-3600}
      # Container namespace only; host publication below is loopback by default.
      REVIEW_LISTEN_HOST: 0.0.0.0
      REVIEW_PORT: "8080"
    ports:
      - target: 8080
        published: "8080"
        host_ip: ${REVIEW_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    volumes:
      - type: bind
        source: ./knowledge
        target: /app/knowledge
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2); assert r.status == 200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
